<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 文生图提示词生成器</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            color: #e0e0e0;
            min-height: 100vh;
            padding: 40px 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 28px;
            background: linear-gradient(90deg, #00d2ff, #3a7bd5);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
        }
        .form-group label {
            margin-bottom: 8px;
            font-size: 14px;
            color: #aaa;
        }
        .form-group select {
            padding: 10px 14px;
            border: 1px solid #333;
            border-radius: 8px;
            background: #0f3460;
            color: #e0e0e0;
            font-size: 14px;
            cursor: pointer;
            transition: border-color 0.3s;
        }
        .form-group select:hover {
            border-color: #3a7bd5;
        }
        .btn-generate {
            display: block;
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(90deg, #00d2ff, #3a7bd5);
            color: #fff;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.3s;
        }
        .btn-generate:hover { opacity: 0.85; }
        .result-box {
            margin-top: 30px;
            padding: 20px;
            background: rgba(255,255,255,0.05);
            border: 1px solid #333;
            border-radius: 12px;
            display: none;
        }
        .result-box h3 {
            margin-bottom: 12px;
            color: #00d2ff;
        }
        .result-wrapper {
            display: flex;
            gap: 10px;
            align-items: stretch;
        }
        .result-textarea {
            flex: 1;
            min-height: 120px;
            padding: 12px;
            background: #0a1628;
            border: 1px solid #333;
            border-radius: 6px;
            color: #e0e0e0;
            font-size: 13px;
            line-height: 1.6;
            resize: vertical;
            font-family: "Microsoft YaHei", sans-serif;
        }
        .btn-copy-all {
            padding: 10px 20px;
            border: 1px solid #00d2ff;
            border-radius: 6px;
            background: transparent;
            color: #00d2ff;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            white-space: nowrap;
        }
        .btn-copy-all:hover {
            background: #00d2ff;
            color: #0a1628;
        }
        .warning {
            margin-top: 12px;
            padding: 10px;
            background: rgba(255, 165, 0, 0.15);
            border: 1px solid #ffa500;
            border-radius: 6px;
            color: #ffa500;
            font-size: 13px;
            display: none;
        }
        @media (max-width: 600px) {
            .form-grid { grid-template-columns: 1fr; }
            .result-wrapper { flex-direction: column; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎨 AI 文生图提示词生成器</h1>

        <div class="form-grid">
            <div class="form-group">
                <label>年龄 (20-40)</label>
                <select id="age">
                    {% for a in ages %}
                    <option value="{{ a }}" {% if a == 25 %}selected{% endif %}>{{ a }}岁</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label>性别</label>
                <select id="gender">
                    {% for g in genders %}
                    <option value="{{ g }}">{{ g }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label>人脸特征</label>
                <select id="face">
                    {% for f in faces %}
                    <option value="{{ f }}">{{ f }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label>场景</label>
                <select id="scene">
                    {% for s in scenes %}
                    <option value="{{ s }}">{{ s }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label>姿势</label>
                <select id="pose">
                    {% for p in poses %}
                    <option value="{{ p }}">{{ p }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label>穿搭</label>
                <select id="outfit">
                    {% for o in outfits %}
                    <option value="{{ o }}">{{ o }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>

        <button class="btn-generate" onclick="generatePrompt()">✨ 生成提示词</button>

        <div class="warning" id="warning"></div>

        <div class="result-box" id="resultBox">
            <h3>生成结果</h3>
            <div class="result-wrapper">
                <textarea class="result-textarea" id="combinedResult" readonly></textarea>
                <button class="btn-copy-all" onclick="copyAll()">📋 复制全部</button>
            </div>
        </div>
    </div>

    <script>
        async function generatePrompt() {
            const payload = {
                age: document.getElementById("age").value,
                gender: document.getElementById("gender").value,
                face: document.getElementById("face").value,
                scene: document.getElementById("scene").value,
                pose: document.getElementById("pose").value,
                outfit: document.getElementById("outfit").value
            };

            const response = await fetch("/generate", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });

            const data = await response.json();

            // 合并显示
            const combinedText = `正向提示词：${data.positive}\n反向提示词：${data.negative}`;
            document.getElementById("combinedResult").value = combinedText;
            document.getElementById("resultBox").style.display = "block";

            // 冲突警告
            const warnEl = document.getElementById("warning");
            if (data.warning) {
                warnEl.textContent = data.warning;
                warnEl.style.display = "block";
            } else {
                warnEl.style.display = "none";
            }
        }

        function copyAll() {
            const textarea = document.getElementById("combinedResult");
            textarea.select();
            textarea.setSelectionRange(0, 99999); // For mobile devices
            
            navigator.clipboard.writeText(textarea.value).then(() => {
                const btn = document.querySelector(".btn-copy-all");
                const originalText = btn.textContent;
                btn.textContent = "✅ 已复制!";
                setTimeout(() => { btn.textContent = originalText; }, 1500);
            });
        }
    </script>
</body>
</html>
